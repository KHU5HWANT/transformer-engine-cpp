<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" /> <!-- Emerald 500 -->
      <stop offset="100%" stop-color="#059669" /> <!-- Emerald 600 -->
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="20" fill="#0f172a" /> <!-- Slate 900 -->
  <!-- Center Node -->
  <circle cx="50" cy="50" r="14" fill="url(#grad)" />
  <!-- Top Left Node & Connection -->
  <line x1="30" y1="30" x2="50" y2="50" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
  <circle cx="30" cy="30" r="8" fill="#cbd5e1" />
  <!-- Top Right Node & Connection -->
  <line x1="70" y1="30" x2="50" y2="50" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
  <circle cx="70" cy="30" r="8" fill="#cbd5e1" />
  <!-- Bottom Left Node & Connection -->
  <line x1="30" y1="70" x2="50" y2="50" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
  <circle cx="30" cy="70" r="8" fill="#cbd5e1" />
  <!-- Bottom Right Node & Connection -->
  <line x1="70" y1="70" x2="50" y2="50" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
  <circle cx="70" cy="70" r="8" fill="#cbd5e1" />
  <!-- Core highlight -->
  <circle cx="50" cy="50" r="6" fill="#0f172a" opacity="0.6"/>
</svg>
